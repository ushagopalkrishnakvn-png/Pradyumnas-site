         h1 {
           color:red;

         .comment-list {

        }

    <h2>Leave a Comment</h2>
    
    <div class="comment-form">
        <!-- New Username Input Field -->
        <input type="text" id="usernameInput" placeholder="Your Name" required>
        <textarea id="commentInput" placeholder="Write your comment here..." required></textarea>
        <button id="submitBtn">Post Comment</button>
    </div>

    <h2>Comments</h2>
    <div id="commentList" class="comment-list"></div>

<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>

<script>
    // This loop safely double-checks that Firebase is completely ready before launching
    function startFirebaseApp() {
        if (typeof firebase === 'undefined') {
            setTimeout(startFirebaseApp, 100); // Retry every 100ms if Scratch blocks the network thread
            return;
        }

        // Paste YOUR real keys here:
        const firebaseConfig = {
            apiKey: "AIzaSyCUBpc_1cxIeet0howHuy2RerJwtbRhZmk",
            authDomain: "my-comments-app.firebaseapp.com",
            projectId: "my-comments-app",
            storageBucket: "my-comments-app.firebasestorage.app",
            messagingSenderId: "694570623032",
            appId: "1:694570623032:web:0e402c54fa49a7f9eec6cd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const usernameInput = document.getElementById('usernameInput');
        const commentInput = document.getElementById('commentInput');
        const submitBtn = document.getElementById('submitBtn');
        const commentList = document.getElementById('commentList');

        submitBtn.addEventListener('click', function() {
            const username = usernameInput.value.trim();
            const commentText = commentInput.value.trim();

            if (username === "" || commentText === "") {
                alert("Please fill out both fields!");
                return;
            }

            db.collection("comments").add({
                name: username,
                text: commentText,
                timestamp: Date.now()
            }).then(() => {
                commentInput.value = "";
            });
        });

        db.collection("comments").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            commentList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const commentData = docSnap.data();
                const commentDiv = document.createElement('div');
                commentDiv.classList.add('comment-item');
                commentDiv.innerHTML = `
                    <div style="font-weight:bold;">${commentData.name}</div>
                    <p>${commentData.text}</p>
                `;
                commentList.appendChild(commentDiv);
            });
        });
    }

    // Launch the listener sequence safely
    window.addEventListener('load', startFirebaseApp);
</script>
</center>
