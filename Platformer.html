    <style>
        body {
            background-color:navy;
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .comment-form {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            padding:2px 8px;
            border-radius:5px;
            background-color:gray;
            color:white;
            border: none;
            cursor: pointer;
            align-self: flex-start;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            text-decoration:none;
        }
         h1 {
           color:red;
            font-size:50px
         }
         .comment-list {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .comment-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            position: relative;
        }
        .comment-time {
            font-size: 0.8rem;
            color: #777;
            margin-top: 5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="text"] {
            height: 40px;
        }
        .comment-username {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .comment-text {
            margin: 5px 0;
            color: #555;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<center>
    <h1>Platformer</h1>
    <iframe src="https://turbowarp.org/1365172616/embed" width="485" height="402" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen></iframe>
    <h2>Leave a Comment</h2>
    
    <div class="comment-form">
        <!-- New Username Input Field -->
        <input type="text" id="usernameInput" placeholder="Your Name" required>
        <textarea id="commentInput" placeholder="Write your comment here..." required></textarea>
        <button id="submitBtn">Post Comment</button>
    </div>

    <h2>Comments</h2>
    <div id="commentList" class="comment-list"></div>

<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>

<script type="module">
    // 2. We import specific functions directly from Google's servers. 
    // This completely removes the old broken "firebase." prefix format.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    onSnapshot, 
    query, 
    orderBy 
} from "https://gstatic.com";

    // 3. Paste YOUR real keys here from your Firebase Console
    const firebaseConfig = {
        apiKey: "AIzaSyCUBpc_1cxIeet0howHuy2RerJwtbRhZmk",
        authDomain: "my-comments-app.firebaseapp.com",
        projectId: "my-comments-app",
        storageBucket: "my-comments-app.firebasestorage.app",
        messagingSenderId: "694570623032",
        appId: "1:694570623032:web:0e402c54fa49a7f9eec6cd"

    };

    // 4. Initialize Firebase safely using the modern syntax
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Connect to your HTML input elements
    const usernameInput = document.getElementById('usernameInput');
    const commentInput = document.getElementById('commentInput');
    const submitBtn = document.getElementById('submitBtn');
    const commentList = document.getElementById('commentList');

    // 5. Save comments globally to the cloud database
    submitBtn.addEventListener('click', async function() {
        const username = usernameInput.value.trim();
        const commentText = commentInput.value.trim();

        if (username === "" || commentText === "") {
            alert("Please fill out both your name and comment text!");
            return;
        }

        try {
            // Adds the text document directly to the cloud collection
            await addDoc(collection(db, "comments"), {
                name: username,
                text: commentText,
                timestamp: Date.now()
            });

            // Clear comment text box on success
            commentInput.value = "";
        } catch (error) {
            console.error("Cloud saving error: ", error);
        }
    });

    // 6. Read and sync all comments globally for all users in real time
    const q = query(collection(db, "comments"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        commentList.innerHTML = ""; // Clear list wrapper to reset UI layout

        snapshot.forEach((docSnap) => {
            const commentData = docSnap.data();
            const dateText = new Date(commentData.timestamp).toLocaleString();

            const commentDiv = document.createElement('div');
            commentDiv.classList.add('comment-item');

            commentDiv.innerHTML = `
                <div class="comment-username" style="font-weight: bold;">${commentData.name}</div>
                <p class="comment-text" style="margin: 5px 0;">${commentData.text}</p>
                <div class="comment-time" style="font-size: 0.8rem; color: #777;">Posted: ${dateText}</div>
            `;

            commentList.appendChild(commentDiv);
        });
    });
</script>
</center>
