<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pradyumna's Site</title>
    <style>
        body {
            background-color:navy;
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .comment-form {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            padding:2px 8px;
            border-radius:5px;
            background-color:gray;
            color:white;
            border: none;
            cursor: pointer;
            align-self: flex-start;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            text-decoration:none;
        }
         h1 {
           color:red;
            font-size:50px
         }
         .comment-list {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .comment-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            position: relative;
        }
        .comment-time {
            font-size: 0.8rem;
            color: #777;
            margin-top: 5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="text"] {
            height: 40px;
        }
        .comment-username {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .comment-text {
            margin: 5px 0;
            color: #555;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>
    <button><a href="index.html">Home</a></button>
    <button><a href="secondpage.html">Info</a></button>
    <button><a href="games.html">Games</a></button>
<center>
    <h1>Platformer</h1>
    <iframe src="https://turbowarp.org/1365172616/embed" width="485" height="402" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen></iframe>
    <h2>Leave a Comment</h2>
    
    <div class="comment-form">
        <!-- New Username Input Field -->
        <input type="text" id="usernameInput" placeholder="Your Name" required>
        <textarea id="commentInput" placeholder="Write your comment here..." required></textarea>
        <button id="submitBtn">Post Comment</button>
    </div>

    <h2>Comments</h2>
    <div id="commentList" class="comment-list"></div>

<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>

<script>
    // 2. Wait until both the Scratch game loops and Firebase modules finish downloading
    window.addEventListener('load', function() {
        
        // 3. PASTE YOUR ACTUAL FIREBASE CREDS HERE FROM THE FIREBASE CONSOLE
        const firebaseConfig = {
            apiKey: "AIzaSyCUBpc_1cxIeet0howHuy2RerJwtbRhZmk",
            authDomain: "my-comments-app.firebaseapp.com",
            projectId: "my-comments-app",
            storageBucket: "my-comments-app.firebasestorage.app",
            messagingSenderId: "694570623032",
            appId: "1:694570623032:web:0e402c54fa49a7f9eec6cd"
        };

        // Initialize Firebase on the global browser scope
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Connect to your HTML Form Elements
        const usernameInput = document.getElementById('usernameInput');
        const commentInput = document.getElementById('commentInput');
        const submitBtn = document.getElementById('submitBtn');
        const commentList = document.getElementById('commentList');

        // 4. Save comments to the SHARED CLOUD DATABASE
        submitBtn.addEventListener('click', function() {
            const username = usernameInput.value.trim();
            const commentText = commentInput.value.trim();

            if (username === "" || commentText === "") {
                alert("Please fill out both fields!");
                return;
            }

            // This pushes the data directly to Google's servers
            db.collection("comments").add({
                name: username,
                text: commentText,
                timestamp: Date.now()
            })
            .then(() => {
                commentInput.value = ""; // Clear box on success
            })
            .catch((error) => {
                console.error("Database connection failure:", error);
            });
        });

        // 5. Read ALL comments from ALL users in Real Time
        // onSnapshot monitors the database cloud. If User A posts, User B sees it immediately.
        db.collection("comments").orderBy("timestamp", "desc")
        .onSnapshot((snapshot) => {
            commentList.innerHTML = ""; // Clear previous elements

            snapshot.forEach((docSnap) => {
                const commentData = docSnap.data();
                const commentId = docSnap.id;
                const dateText = new Date(commentData.timestamp).toLocaleString();

                // Create the visible comment container layout
                const commentDiv = document.createElement('div');
                commentDiv.classList.add('comment-item');

                const nameDiv = document.createElement('div');
                nameDiv.classList.add('comment-username');
                nameDiv.style.fontWeight = 'bold';
                nameDiv.textContent = commentData.name;
                commentDiv.appendChild(nameDiv);

                const textPara = document.createElement('p');
                textPara.classList.add('comment-text');
                textPara.textContent = commentData.text;
                commentDiv.appendChild(textPara);

                const timeDiv = document.createElement('div');
                timeDiv.classList.add('comment-time');
                timeDiv.style.fontSize = '0.8rem';
                timeDiv.style.color = '#777';
                timeDiv.textContent = `Posted on: ${dateText}`;
                commentDiv.appendChild(timeDiv);

                // Add a Delete Button
                const deleteBtn = document.createElement('button');
                deleteBtn.classList.add('delete-btn');
                deleteBtn.textContent = 'Delete';
                
                deleteBtn.addEventListener('click', function() {
                    if (confirm("Are you sure you want to delete this public comment?")) {
                        db.collection("comments").doc(commentId).delete();
                    }
                });
                commentDiv.appendChild(deleteBtn);
                commentList.appendChild(commentDiv);
            });
        });
    });
</script>
</center>
</body>
